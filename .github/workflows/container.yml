name: Container build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  container:
    name: ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - candlepin
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.container }} container
        run: make build
      - name: Verify runtime contract
        run: |
          image=quay.io/foreman/candlepin:foreman-nightly
          test "$(podman inspect --format '{{ json .Config.Cmd }}' "$image")" = \
            '["/usr/libexec/tomcat/server","start"]'
          podman run --rm --entrypoint /bin/sh "$image" -c '
            test "$(id -u):$(id -g)" = 53:53
            test -x /usr/local/bin/candlepin-db-migrate
            test -x /usr/libexec/tomcat/server
          '
          migration_version="$(podman run --rm --entrypoint /bin/bash "$image" -c \
            '/usr/local/bin/candlepin-db-migrate --version' 2>&1)"
          grep -q 'using Java 25' <<< "$migration_version"
